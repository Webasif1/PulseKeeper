<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Website health monitoring and uptime tracking for developers." />
    <meta name="color-scheme" content="light dark" />
    <title>PulseKeeper</title>
    <script>
      // Applied before first paint: reading the stored theme in React would
      // render the default palette for a frame and flash the wrong colours.
      (function () {
        try {
          var stored = localStorage.getItem('pulsekeeper-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : null;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (error) {
          // Private browsing can make localStorage throw; the default is fine.
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
