name: Bug report
description: Report something that is not working as expected
title: "bug: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do **not** report security vulnerabilities here —
        follow [SECURITY.md](https://github.com/Webasif1/PulseKeeper/blob/main/SECURITY.md) instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / dashboard
        - Backend API
        - Monitoring / cron
        - Incidents
        - Analytics / charts
        - Notifications
        - Authentication
        - Setup / deployment
        - Documentation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      description: Paste server logs or browser console output. Redact secrets and connection strings.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v0.1.0 or commit sha"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11
        Node: 22.x
        MongoDB: Docker mongo:7 / Atlas
        Browser: Chrome 140
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I removed all secrets from the logs and details above
          required: true
