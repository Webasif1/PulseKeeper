name: Feature request
description: Suggest an idea or improvement
title: "feat: "
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the pain point rather than jumping straight to a solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should PulseKeeper do?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend / dashboard
        - Backend API
        - Monitoring / cron
        - Incidents
        - Analytics / charts
        - Notifications
        - Authentication
        - Setup / deployment
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This keeps the project on the MERN stack (no Next.js, Supabase, Firebase, SQL, or Prisma)
          required: true
        - label: I searched existing issues and this is not a duplicate
          required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this
